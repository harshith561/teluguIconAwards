<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="30%" stop-color="#FCD34D" />
      <stop offset="65%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#926D14" />
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#926D14" />
      <stop offset="50%" stop-color="#FFF3B0" />
      <stop offset="100%" stop-color="#926D14" />
    </linearGradient>
  </defs>

  <!-- Soft Gold Glow Behind -->
  <circle cx="50" cy="45" r="32" fill="rgba(212, 175, 55, 0.16)" />

  <!-- Cup Handles -->
  <path d="M 28 26 C 13 26 11 48 27 52 C 30 53 32 49 30 46 C 22 43 23 33 29 32 Z" fill="url(#goldGrad)" />
  <path d="M 72 26 C 87 26 89 48 73 52 C 70 53 68 49 70 46 C 78 43 77 33 71 32 Z" fill="url(#goldGrad)" />

  <!-- Cup Chalice Body -->
  <path d="M 28 22 L 72 22 C 72 22 71 48 56 57 C 53 59 47 59 44 57 C 29 48 28 22 28 22 Z" fill="url(#goldGrad)" />
  <!-- Cup Rim -->
  <ellipse cx="50" cy="22" rx="22" ry="5" fill="#FFF3B0" stroke="#926D14" stroke-width="1" />
  <ellipse cx="50" cy="22" rx="18.5" ry="3.5" fill="#382506" />

  <!-- Front Embossed Star Emblem -->
  <path d="M 50 31 L 52.2 36.8 L 58.5 37 L 53.5 41 L 55.4 47 L 50 43.4 L 44.6 47 L 46.5 41 L 41.5 37 L 47.8 36.8 Z" fill="#FFFBEB" stroke="#926D14" stroke-width="0.5" />

  <!-- Stem & Node -->
  <path d="M 46 57 L 54 57 L 53 71 L 47 71 Z" fill="url(#stemGrad)" />
  <circle cx="50" cy="64" r="4.5" fill="url(#goldGrad)" stroke="#FFF3B0" stroke-width="0.8" />

  <!-- Stepped Pedestal Base -->
  <path d="M 41 71 L 59 71 L 62 76 L 38 76 Z" fill="url(#goldGrad)" />
  <rect x="33" y="76" width="34" height="7" rx="2" fill="url(#goldGrad)" stroke="#382506" stroke-width="0.5" />
  <rect x="30" y="83" width="40" height="4.5" rx="1.5" fill="#785507" />

  <!-- Luxury Diamond Sparkle Top-Right -->
  <path d="M 68 18 L 70 12 L 72 18 L 78 20 L 72 22 L 70 28 L 68 22 L 62 20 Z" fill="#FFFFFF" />
  <circle cx="70" cy="20" r="1.5" fill="#FFE885" />
</svg>
